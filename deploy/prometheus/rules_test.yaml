rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'noroshi_check_up{page="home",component="wiki",check="https",type="http",alert="true"}'
        values: "0x5"
      - series: 'noroshi_check_info{page="home",component="wiki",check="https",name="Wiki",target="https://wiki.example/"}'
        values: "1x5"
      - series: 'noroshi_check_failure_info{page="home",component="wiki",check="https",reason="HTTP 502"}'
        values: "1x5"
      - series: 'noroshi_page_info{page="home",title="Service Status",url="https://status.example/p/home"}'
        values: "1x5"
      - series: 'noroshi_check_up{page="home",component="plex",check="https",type="http",alert="false"}'
        values: "0x5"
      - series: 'noroshi_check_up{page="home",component="cdn",check="tls",type="tls",alert="true"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 2m
        alertname: NoroshiCheckDown
        exp_alerts:
          - exp_labels:
              severity: critical
              page: home
              component: wiki
              check: https
              type: http
              alert: "true"
            exp_annotations:
              summary: "home/wiki: check https is down"
              name: Wiki
              target: https://wiki.example/
              reason: HTTP 502
              page_title: Service Status
              page_url: https://status.example/p/home
          # No check info or failure series: the alert still fires, with
          # empty fields. Page info comes from the page, so it is still there.
          - exp_labels:
              severity: critical
              page: home
              component: cdn
              check: tls
              type: tls
              alert: "true"
            exp_annotations:
              summary: "home/cdn: check tls is down"
              name: ""
              target: ""
              reason: ""
              page_title: Service Status
              page_url: https://status.example/p/home
