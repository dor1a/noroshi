# Example routes for noroshi alerts. Merge the routes and receivers into your
# own Alertmanager config; the webhook files hold Discord webhook URLs.
templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: ops
  routes:
    # Send one component somewhere else, for example a channel its users read.
    # The first matching route wins, so keep specific routes above general ones.
    - matchers:
        - alertname="NoroshiCheckDown"
        - page="public"
        - component="game-server"
      receiver: players
      group_by:
        - alertname
        - page
        - component
        - check
      group_wait: 10s
      group_interval: 1m
    # Every other check: one message per check, because Discord colours a whole
    # message red while anything in it is down. A short group_interval sends the
    # recovery within a minute instead of five.
    - matchers:
        - alertname="NoroshiCheckDown"
      receiver: uptime
      group_by:
        - alertname
        - page
        - component
        - check
      group_wait: 10s
      group_interval: 1m

receivers:
  # noroshi's own health (NoroshiNoProberLeader, NoroshiCheckStalled, ...).
  - name: ops
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/ops_webhook
  - name: uptime
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/uptime_webhook
        title: '{{ template "noroshi.title" . }}'
        message: '{{ template "noroshi.message" . }}'
  # Players see only names, times and the page link.
  - name: players
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/players_webhook
        title: '{{ template "noroshi.title" . }}'
        message: '{{ template "noroshi.public.message" . }}'
  # The same messages for a Microsoft Teams channel (Workflows webhook).
  - name: uptime-teams
    msteamsv2_configs:
      - webhook_url_file: /etc/alertmanager/secrets/uptime_teams_webhook
        title: '{{ template "noroshi.teams.title" . }}'
        text: '{{ template "noroshi.teams.text" . }}'
