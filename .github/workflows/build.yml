name: build

# Branches only run the tests. Images are built for version tags:
# vX.Y.Z gets X.Y.Z, X.Y, and latest; vX.Y.Z-rc.N gets only its own tag.
on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/noroshi validate deploy/config.example.yaml

  # The Dockerfile cross-compiles from $BUILDPLATFORM, so arm64 needs no QEMU.
  image:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      STABLE: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE }}
            type=raw,value=latest,enable=${{ env.STABLE }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Discord, when the DISCORD_WEBHOOK secret is set: one message per release,
  # and one for any failed run.
  notify:
    needs:
      - test
      - image
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      ACTOR: ${{ github.actor }}
      MSG: ${{ github.event.head_commit.message }}
      REF: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      TS: ${{ github.event.head_commit.timestamp }}
    steps:
      - name: ✅ Release built
        if: ${{ env.DISCORD_WEBHOOK != '' && startsWith(github.ref, 'refs/tags/v') && needs.image.result == 'success' }}
        run: |
          desc=$(printf '👤 **Committer:** %s\n📜 **Message:** %s\n🐳 **Image:** `ghcr.io/%s:%s`\n[🔍 View logs](https://github.com/%s/actions/runs/%s)' \
            "$ACTOR" "$MSG" "$REPO" "${REF#v}" "$REPO" "$RUN_ID")
          jq -n --arg t "✅ noroshi $REF built (amd64 + arm64)" --arg d "$desc" --arg ts "$TS" \
            '{embeds:[{title:$t,description:$d,color:65280,timestamp:$ts}]}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: ❌ Build failed
        if: ${{ env.DISCORD_WEBHOOK != '' && contains(needs.*.result, 'failure') }}
        run: |
          desc=$(printf '👤 **Committer:** %s\n🌿 **Ref:** %s\n📜 **Message:** %s\n[🔍 View logs](https://github.com/%s/actions/runs/%s)' \
            "$ACTOR" "$REF" "$MSG" "$REPO" "$RUN_ID")
          jq -n --arg t "❌ noroshi build failed" --arg d "$desc" --arg ts "$TS" \
            '{embeds:[{title:$t,description:$d,color:16711680,timestamp:$ts}]}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
