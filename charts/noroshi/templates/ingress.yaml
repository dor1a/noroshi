{{- range $listener := list "public" "admin" }}
{{- $ing := index $.Values.ingress $listener }}
{{- if $ing.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "noroshi.serviceName" (list $ $listener) }}
  labels:
    {{- include "noroshi.labels" $ | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := required (printf "ingress.%s.hosts is required" $listener) $ing.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "noroshi.serviceName" (list $ $listener) }}
                port:
                  name: {{ $listener }}
    {{- end }}
{{- end }}
{{- end }}
