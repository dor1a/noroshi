{{- range $listener := list "public" "admin" }}
{{- $route := index $.Values.httpRoute $listener }}
{{- if $route.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "noroshi.serviceName" (list $ $listener) }}
  labels:
    {{- include "noroshi.labels" $ | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required (printf "httpRoute.%s.parentRefs is required" $listener) $route.parentRefs | toYaml | nindent 4 }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "noroshi.serviceName" (list $ $listener) }}
          port: {{ (index $.Values.service $listener).port }}
{{- end }}
{{- end }}
